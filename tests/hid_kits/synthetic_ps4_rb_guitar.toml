# Synthetic fixture matching the PS4 Rock Band guitar spec from PlasticBand.
# Pairs with synthetic_ps4_rb_guitar.raw.jsonl, where each "press" sample is
# hand-crafted to set exactly the bit at the spec-defined position. The
# validator exercises the full TOML loader + packer pipeline (loader paths,
# fret_byte resolution, dud0_bit_remap, button table lookup, HAT mask).

schema       = "shadps4-legacy-instrument/v1"
vendor_id    = "0xdead"
product_id   = "0xbeef"
name         = "Synthetic PS4 RB Guitar Fixture"
device_class = "guitar"
report_length = 64

guitar_ps4_layout = true
fret_byte        = 46
fret_mask        = 0x1F
solo_fret_byte   = 47

whammy_byte      = 44
whammy_baseline  = 0
tilt_byte        = 45
tilt_baseline    = 0
tilt_scale       = 80
tilt_invert      = true

hat_byte         = 5

[buttons_byte_5]
"0x10" = "square"    # blue fret face flag
"0x20" = "cross"     # green
"0x40" = "circle"    # red
"0x80" = "triangle"  # yellow

[buttons_byte_6]
"0x01" = "l1"        # orange
"0x10" = "left"      # Select  -> Star Power
"0x20" = "options"   # Start

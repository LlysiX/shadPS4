# Guitar Hero series Xbox 360 guitars (Les Paul, World Tour, GH5, Warriors
# of Rock, X-plorer). XInput-source kit: input arrives via SDL_GameController
# instead of raw HID, mapped through a 9-byte synthetic report. Layout per
# PlasticBand Docs/Instruments/5-Fret Guitar/Guitar Hero/Xbox 360.md.

schema       = "shadps4-legacy-instrument/v1"
vendor_id    = "0x0000"
product_id   = "0x0000"
name         = "Guitar Hero Xbox 360 Guitar (any)"
device_class = "guitar"
source       = "xinput"

# Match every gamepad whose SDL-reported name contains "guitar" (case-
# insensitive). Covers GH Les Paul / WT / GH5 / WoR / X-plorer regardless
# of the specific subtype string the driver reports.
match_name   = "guitar"

guitar_ps4_layout = true

# Synthetic XInput report layout (see Input::HidInstrument::FillXInputReport).
#   byte 0 = face button flags (A/B/X/Y/LB/RB)
#   byte 2 = D-pad bitmap (= strum bar; up=bit0, down=bit1)
#   byte 5 = right stick X = whammy
#   byte 6 = right stick Y = tilt
fret_byte       = 0
hat_byte        = 2

# Whammy on XInput is centered at 0x80 and pushes toward 0xFF.
whammy_byte     = 5
whammy_baseline = 0x80

# Tilt on the XInput guitar's right-stick Y: centered at 0x80, INCREASES
# when the guitar is pointed up. tilt_invert is true so positive accel.x
# means "lifted" — same convention as PS5 Riffmaster.
tilt_byte       = 6
tilt_baseline   = 0x80
tilt_scale      = 80
tilt_invert     = true

[buttons_byte_0]
# A/B/X/Y/LB on X360 already match the PS4-native fret bit order
# (green=0, red=1, yellow=2, blue=3, orange=4).
"0x01" = "cross"     # A = green
"0x02" = "circle"    # B = red
"0x04" = "triangle"  # X = yellow
"0x08" = "square"    # Y = blue
"0x10" = "l1"        # LB = orange
"0x20" = "r1"        # RB = pedal port

[buttons_byte_1]
"0x01" = "options"   # Start
"0x02" = "left"      # Back -> D-pad Left (Star Power in RB4)
"0x04" = "touchpad"  # Guide -> Touchpad (pause)

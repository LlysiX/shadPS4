# Guitar Hero / Band Hero / Warriors of Rock Xbox 360 drums. XInput-source
# kit. PlasticBand spec: Docs/Instruments/5-Lane Drums/Xbox 360.md.
#
# Velocities are packed into the high/low bytes of the X360 stick axes.
# The synth report (see FillXInputReport in hid_instrument.cpp) exposes
# each stick as a u8 *and* as a raw int16 little-endian pair, so we can
# address individual velocity bytes:
#   green  = left  stick Y low  byte (synth byte 11)
#   red    = left  stick Y high byte (synth byte 12)
#   yellow = right stick X low  byte (synth byte 13)
#   blue   = right stick X high byte (synth byte 14)
#   orange = right stick Y low  byte (synth byte 15)
#   kick   = right stick Y high byte (synth byte 16)

schema       = "shadps4-legacy-instrument/v1"
vendor_id    = "0x0000"
product_id   = "0x0000"
name         = "Guitar Hero / Band Hero Xbox 360 Drums (any)"
device_class = "drum"
source       = "xinput"
match_name   = "drum"

# Same 5-lane GH-mode dud layout as the PS3 GH drum kit: one velocity per
# colour. RB4 Deluxe's GH-drum mode doesn't distinguish pad vs cymbal.
device_unique_data = [0, 1, 13, 12, 11, 14, 16, 15, 2, -1, -1, -1]
hat_byte = 2

[buttons_byte_0]
# X360 face buttons → PS4 RB drum colours.
"0x01" = "cross"     # A  = green pad
"0x02" = "circle"    # B  = red pad
"0x04" = "square"    # X  = blue pad
"0x08" = "triangle"  # Y  = yellow pad / yellow cymbal
"0x10" = "l1"        # LB = kick pedal
"0x20" = "r1"        # RB = orange (5th lane in GH-mode)

[buttons_byte_1]
"0x01" = "options"   # Start
"0x02" = "touchpad"  # Back
